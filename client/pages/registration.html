<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>The Debtor</title>
		<link rel="stylesheet" href="/styles/style.css" />
		<link rel="stylesheet" href="/styles/registration/style.css" />
		<script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
		<script src="/dist/registration/script.js" defer type="module"></script>
	</head>
	<body>
		<main>
			<span class="main__title">Создание аккаунта</span>

			<form action="#" class="create-user-form" id="create-user-form">
				<div class="create-user-form__item">
					<label for="create-user-form__login">Логин</label
					><input
						type="text"
						placeholder="Введите ваш логин"
						id="create-user-form__login"
						name="login"
					/>
				</div>
				<div class="create-user-form__item">
					<label for="create-user-form__email">Email</label
					><input
						type="email"
						placeholder="Введите ваш email"
						id="create-user-form__email"
						name="email"
					/>
				</div>
				<div class="create-user-form__item">
					<label for="create-user-form__nickname">Никнейм</label
					><input
						type="text"
						placeholder="Введите ваш никнейм"
						id="create-user-form__nickname"
						name="nickname"
					/>
				</div>
				<div class="create-user-form__item">
					<label for="create-user-form__password">Пароль</label
					><input
						type="text"
						placeholder="Введите ваш пароль"
						id="create-user-form__password"
						name="password"
					/>
				</div>
				<div class="create-user-form__item">
					<label for="create-user-form__password-repeat"
						>Подтвердите пароль</label
					><input
						type="text"
						placeholder="Введите еще раз ваш пароль"
						id="create-user-form__password-repeat"
					/>
				</div>

				<button type="submit" class="create-user-form__submit-btn">
					Зарегистрироваться
				</button>
			</form>

			<div class="main__login-text">Уже есть аккаунт?</div>
			<div>
				<a href="/login"><button class="main__login-btn">Войти</button></a>
			</div>
		</main>
	</body>
</html>
