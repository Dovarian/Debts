<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>The Debtor</title>
		<link rel="stylesheet" href="/styles/style.css" />
		<link rel="stylesheet" href="/styles/login/style.css" />
		<script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
		<script src="/dist/login/script.js" defer type="module"></script>
	</head>
	<body>
		<main>
			<span class="main__title">Вход в аккаунт</span>

			<form class="login-form" id="login-form">
				<div class="login-form__item">
					<label for="login-form__loginOrEmail">Логин или email</label
					><input
						type="text"
						placeholder="Введите ваш логин или email"
						id="login-form__loginOrEmail"
						name="loginOrEmail"
					/>
				</div>
				<div class="login-form__item">
					<label for="login-form__password">Пароль</label
					><input
						type="text"
						placeholder="Введите ваш пароль"
						id="login-form__password"
						name="password"
					/>
				</div>

				<button type="submit" class="login-form__submit-btn">Войти</button>
			</form>

			<div class="main__registration-text">Нет аккаунта?</div>
			<div>
				<a href="/registration"
					><button class="main__registration-btn">Зарегистрироваться</button></a
				>
			</div>
		</main>
	</body>
</html>
